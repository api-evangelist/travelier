apis:
- name: Travelier Connect
  description: >-
    Travelier Connect is the group's partner distribution API — marketed on travelier.com/partners as
    "the largest ground & sea transportation GDS", aggregating 12,000+ intercity transport operators
    across 122 countries and ~500,000 routes (bus, ferry, train, shuttle) with real-time availability,
    pricing and content behind a single API. No public API reference, base URL or machine-readable
    contract is published; onboarding is a "Let's Talk" sales conversation.
  humanURL: https://www.travelier.com/partners/
  tags:
  - Transportation
  - Distribution
  - Booking
  properties:
  - type: Website
    url: https://www.travelier.com/partners/
  - type: Support
    url: https://www.travelier.com/contact/
  x-access: partner-only
  x-base-url-note: >-
    No base URL is published. https://api.travelier.com is live and answers every path with
    HTTP 403 {"message":"Missing Authentication Token"} (an AWS API Gateway default), which
    proves an authenticated API host exists on the company apex but does NOT establish that it
    serves Travelier Connect, so baseURL is deliberately left unset rather than guessed.
- name: SeatOS API
  description: >-
    SeatOS is Travelier's SaaS transportation management system for ground and sea operators (built
    for APAC operators, sibling to Sisorg in Latin America). Its marketing site publishes a single
    documented operation — POST /v1/availability/search returning live trips, seat availability and
    pricing — and states that "one API connection gives OTAs, GDSs, resellers, and agents live
    inventory, availability, and pricing". The full reference is available only via a "Request API
    docs" contact form; docs.seatos.com and api.seatos.com both serve the login SPA.
  humanURL: https://www.seatos.com/
  tags:
  - Transportation
  - Booking
  tags_raw:
  - Transportation
  - Booking
  - Operations
  properties:
  - type: Website
    url: https://www.seatos.com/
  - type: Support
    url: https://www.seatos.com/contact.html
  x-access: partner-only
  x-documented-operations:
  - method: POST
    path: /v1/availability/search
    source: https://www.seatos.com/
    note: >-
      Published verbatim as a marketing code sample with request and response JSON but no host.
      Recorded as evidence only — not enough to author an OpenAPI, and none was authored.
