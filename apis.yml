aid: travelier
name: Travelier
description: >-
  Travelier (founded 2016, formerly Bookaway Group, headquartered in Tel Aviv, Israel) is a travel
  technology group digitizing ground and sea transportation — the segment of travel that is still
  largely sold offline. The group operates seven consumer and operator brands: Bookaway, 12Go,
  Plataforma10, DeOnibus, Traveling.com, Sisorg and SeatOS, together reaching more than 120 countries
  and roughly 14 million monthly visitors. Its commercial developer surface is Travelier Connect, a
  single partner API that the company markets as the largest ground and sea transportation GDS —
  12,000+ operators across 122 countries and around 500,000 routes for buses, ferries, trains and
  shuttles — alongside the SeatOS transportation management system, which exposes the same inventory
  to OTAs, GDSs, resellers and agent networks through one API connection. Both are partner
  integrations: as of this profile no public developer portal, API reference or machine-readable
  contract is published, and access runs through a sales contact form.
