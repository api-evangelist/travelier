note: >-
  Travelier publishes no plans, tiers, prices or quotas for Travelier Connect or the SeatOS API.
  The partners page ends in a "Let's Talk" contact form and the SeatOS site in a "Request API docs"
  contact form; there is no pricing page, no self-serve signup and no published rate card on
  travelier.com, seatos.com or any brand host. Commercial terms are negotiated per partner. The
  consumer brands (Bookaway, 12Go, Plataforma10, DeOnibus, Traveling.com) sell tickets, not API
  access. 12Go additionally runs a revenue-share affiliate programme (50% of profit, ~$3 average
  commission per booking, 8% referral for 36 months) which is a payout schedule rather than an API
  plan, and its XML API/data-feed access sits behind affiliate sign-in.
